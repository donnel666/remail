        - name: keyId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: System key revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # --- Bot integration ---
  /v1/bot/ws:
    get:
      operationId: connectBotWebSocket
      summary: Open the persistent Bot WebSocket transport
      description: |
        Authenticates one Bot System Key during the HTTP upgrade. The connection carries heartbeat,
        request/response multiplexing for the allowlisted `/v1/bot/**` operations, and resumable
        events for `project.launched`, `leaderboard.settled`, `system.notice.updated`,
        `system.announcement.updated`, `email.discount.updated`, and `project.price.updated`.
        A subscribe frame may send a `topics` array; legacy `topic: project.launched` remains valid.
        All selected topics share one server-issued `(after, afterId)` cursor, and each event frame
        contains only its documented safe projection. WebSocket `afterId` is emitted as a decimal
        string to preserve uint64 precision; numeric legacy cursors are still accepted. Platform subjects still come from the trusted
        bot event in each request frame and are never accepted from an end-user argument.

        A request frame carries `subject`, `scene`, and, only when `scene` is `group`, `groupId`.
        `groupId` is required for a group frame and must be present in the authenticated System Key's
        `allowedGroupIds`; it must be omitted for a private frame. The server revalidates these fields
        for every tunneled request. Missing, malformed, or unauthorized context receives the same 401
        response and does not reveal key scope or binding information.
      externalDocs:
        description: Versioned JSON-frame protocol, cursor semantics and proxy configuration
        url: https://github.com/donnel666/remail/blob/main/docs/22-bot-websocket-integration.md
      tags: [Bot]
      security:
        - systemKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BotChannel"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/bot/context:
    get:
      operationId: getBotContext
      summary: Verify the current trusted bot event context
      description: |
        Returns only an authorization acknowledgement. In a private scene, send the trusted subject
        and `X-Bot-Scene: private` without a group header. In a group scene, `X-Bot-Group` is required
        and must match one of the authenticated Bot System Key's `allowedGroupIds`. Missing or invalid
        keys, subjects, scenes, group ids, and non-whitelisted groups all receive the same 401 response;
        this endpoint never returns platform scope, namespace, binding, or account information.
      tags: [Bot]
      security:
        - systemKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BotChannel"
        - $ref: "#/components/parameters/BotSubject"
        - $ref: "#/components/parameters/BotScene"
        - $ref: "#/components/parameters/BotGroup"
      responses:
        "200":
          description: The Bot System Key and trusted event context are authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/bot/profile:
    get:
      operationId: getBotProfile
      summary: Read the current bound user's safe account summary
      description: |
        Resolves only the trusted sender from the current QQ or Telegram event. An unbound sender
        receives a binding instruction instead of account data. A bound sender receives consumer
        balance, cumulative recharge, role, membership group and the next automatic-upgrade gap.
        The response never includes a user id, email address, order data, credentials or another
        user's information. Group callers must be in the System Key whitelist and must deliver the
        returned account summary privately to that same sender.
      tags: [Bot]
      security:
        - systemKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/BotChannel"
        - $ref: "#/components/parameters/BotSubject"
        - $ref: "#/components/parameters/BotScene"
        - $ref: "#/components/parameters/BotGroup"
      responses:
        "200":
          description: Safe profile summary or a binding instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

