    patch:
      operationId: patchAdminICloudResource
      summary: Atomically edit an iCloud resource
      description: |
        Base fields require `core:resource/write`. Supplying `forSale`, `expireAt`, `importLine`, `phoneId`, or `phoneNumber` additionally requires `core:resource/operate`. Session authentication, CSRF, and an idempotency key are required. `importLine` accepts `email----curl[----curl]`, with one old cURL, one new cURL, or both cURLs in either order. While the primary email is unchanged, each supplied cURL replaces only its matching channel and omitted channels are preserved. On an already healthy resource, submitted channels are checked asynchronously without changing resource health. Changing the primary email treats the supplied cURLs as the complete credential set, removes omitted channels, and re-queues resource validation. Changing the email or owner conflicts with an active allocation. Changing `expireAt` only changes future alias creation eligibility. `phoneId` selects the exact active Kitesim phone and `phoneNumber` is checked against it; legacy number-only requests are accepted only when the active number is unique.
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminICloudUpdateRequest"
      responses:
        "200":
          description: Atomic edit committed; email or cURL channel changes that require validation leave the resource pending
