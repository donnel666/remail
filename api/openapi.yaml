              required: [file, ownerId, expireAt]
              properties:
                file:
                  type: string
                  format: binary
                ownerId:
                  type: integer
                  minimum: 1
                expireAt:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        "202":
          description: Durable onboarding import accepted
          content:
            application/json:
              schema:
