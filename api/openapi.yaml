      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKitesimRechargeRequest"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Recharge task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKitesimOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "502":
