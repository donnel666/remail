  /v1/admin/gmail/resources/imports:
    post:
      operationId: postAdminGmailResourceImport
      summary: Import Gmail resources for a selected owner
      description: |
        Requires `core:resource/write`, Session authentication, CSRF, and an idempotency key. The request stores the original TXT in private object storage and the asynchronous import state in Redis before returning 202. Each non-empty line must use one of five formats, with either `----` or `;` between fields: `email----App Password`, `email----password----App Password`, `email----password----binding email----App Password`, `email----password----2FA secret----App Password`, or `email----password----binding email----2FA secret----App Password`. The final field is always the Gmail App Password and all of its whitespace is removed; in four-field rows a valid email third field is the binding email, otherwise it is the 2FA secret. Password, binding email, and 2FA are stored when supplied. Validation only verifies that the submitted App Password can authenticate to Gmail IMAP; it never opens a browser, changes 2FA, revokes App Passwords, or creates a replacement. Canonical duplicate handling, resource creation or deleted-resource restoration, validation, and project-history identification run asynchronously. A restored resource keeps its original resource ID, moves to the selected owner, and returns to `pending` validation. The private source TXT is retained; skipped or failed rows are retained in a private `gmail-import-failures.csv` artifact. Uploaded text, credentials, private object keys, and failure-row email values are never returned or written to ordinary logs.
      tags: [Core]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - ownerId
                - errorStrategy
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 TXT with one Gmail account per non-empty line in one of the five documented formats, using either `----` or `;` as the field delimiter. The final field is always an App Password and its whitespace is ignored; a third field containing an email address is parsed as the optional binding email.
                ownerId:
                  type: integer
                  minimum: 1
                errorStrategy:
                  type: string
                  enum: [skip, abort]
              additionalProperties: false
      responses:
        "202":
          description: Asynchronous Redis-backed import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGmailImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/admin/gmail/resources/imports/{importId}:
    get:
      operationId: getAdminGmailResourceImport
      summary: Get an administrator Gmail-resource import
      description: Requires `core:resource/read`. Returns only safe counters, status, diagnostic text, and the Redis-backed task reference; it never returns uploaded text, credentials, private object keys, or row values containing an email address.
      tags: [Core]
      security:
        - cookieAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGmailImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/admin/gmail/resources/validations:
    post:
      operationId: postAdminGmailResourceValidations
      summary: Queue asynchronous validation for selected Gmail resources
      description: Requires `core:resource/operate`, Session authentication, CSRF, and an idempotency key. The bounded resource ID set is expanded through a Redis-backed cursor; each eligible row is fenced by owner, validation generation, and credential revision before its stored App Password is checked against Gmail IMAP. Successful validation queues history identification and never starts a browser or modifies Google credentials.
      tags: [Core]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGmailValidationBatchRequest"
