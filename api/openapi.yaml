  /v1/resources/{resourceId}/validate:
    post:
      operationId: postResourceValidate
      summary: Queue asynchronous resource validation
      tags:
        - Resources
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      description: >
        Marks the resource pending and returns immediately. The dispatcher
        assigns bounded Redis/Asynq work according to current system capacity;
        Microsoft OAuth/Graph checks and domain DNS checks never run in HTTP.
      responses:
        "202":
          description: Resource validation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceValidationsResponse"
        "400":
          description: Invalid resource id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Resource status does not allow validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/resources/validations:
    post:
      operationId: postResourceValidations
      summary: Queue asynchronous resource validations in batch
      tags:
        - Resources
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      description: >
        Enqueues the selection as an ephemeral Redis/Asynq cursor and returns
        immediately. The worker expands Microsoft and Domain selections one
        bounded page at a time and changes matching resources to pending. The
        dispatcher then changes only a capacity-bounded set to validating and
        enqueues their Redis tasks. Completed page and resource tasks are removed
        immediately; no validation batch or job history is stored in MySQL or
        retained in Redis. This endpoint is the batch counterpart of POST
        /v1/resources/{resourceId}/validate and avoids client-side request loops.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateResourcesRequest"
      responses:
        "202":
          description: Resource validations queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceValidationsResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid resource status/filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

