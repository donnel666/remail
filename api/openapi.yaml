openapi: "3.0.3"
info:
  title: ReMail API
  description: |
    ReMail 邮箱交易平台 — 统一业务 API。
    控制台和 SDK 共用同一接口，由鉴权中间件决定调用者能力。
  version: "0.1.0"
  contact:
    name: ReMail Team

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  # --- System ---
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags:
        - System
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      tags:
        - System
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"

  /v1/announcements:
    get:
      operationId: getSystemAnnouncements
      summary: List active system announcements
      tags:
        - System
      responses:
        "200":
          description: Active system announcements, most recently started first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAnnouncementsResponse"

  /v1/notice:
    get:
      operationId: getSystemNotice
      summary: Read the current system notice
      tags:
        - System
      responses:
        "200":
          description: Current system notice, or an empty string when unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemNoticeResponse"

  /v1/faqs:
    get:
      operationId: getSystemFAQs
      summary: List published frequently asked questions
      tags:
        - System
      responses:
        "200":
          description: Published FAQs ordered by weight and recency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemFAQsResponse"

  /v1/customer-service:
    get:
      operationId: getCustomerService
      summary: Get public customer service links
      tags:
        - System
      responses:
        "200":
          description: Public customer service configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerServiceResponse"

  # --- Activation ---
  /v1/activation:
    get:
      operationId: getActivation
      summary: Check if first activation is needed
      tags:
        - IAM
      responses:
        "200":
          description: Activation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationResponse"

    post:
      operationId: postActivation
      summary: Activate system and create first super_admin
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "201":
          description: Super admin created
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
                additionalProperties: false
        "409":
          description: Activation already completed
          content:
            application/json:
                schema:
                  $ref: "#/components/schemas/Error"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Human verification ---
  /v1/turnstile/config:
    get:
      operationId: getTurnstileConfig
      summary: Get runtime human-verification configuration
      tags:
        - IAM
      responses:
        "200":
          description: Turnstile widget configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnstileConfigResponse"
        "503":
          description: Human verification is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/email/code:
    post:
      operationId: postEmailCode
      summary: Send an email verification code
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "204":
          description: Verification code request accepted
          headers:
            Retry-After:
              description: Configured resend cooldown in seconds
              schema:
                type: integer
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Human verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification code resend cooldown active
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Human verification or mail service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Registration ---
  /v1/users:
    post:
      operationId: postRegister
      summary: Register a new user
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
                additionalProperties: false
        "422":
          description: Verification code incorrect or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Registration verification attempt rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Login / Sessions ---
  /v1/login/config:
    get:
      operationId: getLoginConfig
      summary: Get enabled login methods and current binding state
      tags:
        - IAM
      responses:
        "200":
          description: Login method configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginConfigResponse"

  /v1/oauth/linuxdo:
    get:
      operationId: getLinuxDOAuthorize
      summary: Start Linux DO OAuth login
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to Linux DO authorization or back to login on configuration failure
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login on configuration failure
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/linuxdo/bind:
    get:
      operationId: getLinuxDOBind
      summary: Start Linux DO binding for the current user
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to Linux DO authorization
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login or account when the session is unavailable, already bound, or configuration fails
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/linuxdo/callback:
    get:
      operationId: getLinuxDOCallback
      summary: Complete Linux DO OAuth login or binding
      tags:
        - IAM
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to login or account with the OAuth result
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/linuxdo/pending:
    get:
      operationId: getLinuxDOPending
      summary: Get the pending Linux DO account ownership choice
      tags:
        - IAM
      responses:
        "200":
          description: Pending Linux DO profile and suggested account choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinuxDOPendingResponse"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pending setup could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/linuxdo/email/code:
    post:
      operationId: postLinuxDOEmailCode
      summary: Send the email verification code for Linux DO account ownership
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinuxDOEmailCodeRequest"
      responses:
        "204":
          description: Verification code sent
          headers:
            Retry-After:
              schema:
                type: integer
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid email, account choice, or human verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification code request throttled
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Human verification or mail delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/linuxdo/complete:
    post:
      operationId: postLinuxDOComplete
      summary: Bind or create the verified local account and finish Linux DO login
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinuxDOCompleteRequest"
      responses:
        "200":
          description: Linux DO account ownership completed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: New registration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email or third-party identity is already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Email, account choice, account state, or verification code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many verification attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Account ownership could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/nodeloc:
    get:
      operationId: getNodeLocAuthorize
      summary: Start NodeLoc OAuth login
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to NodeLoc authorization
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login when NodeLoc OAuth is unavailable
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/nodeloc/bind:
    get:
      operationId: getNodeLocBind
      summary: Start NodeLoc binding for the current user
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to NodeLoc authorization
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login or account when binding cannot start
          headers:
            Location:
              schema:
                type: string

  /oauth/nodeloc:
    get:
      operationId: getNodeLocCallback
      summary: Complete NodeLoc OAuth login or binding
      tags:
        - IAM
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to login or account with the OAuth result
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/nodeloc/pending:
    get:
      operationId: getNodeLocPending
      summary: Get the pending NodeLoc account setup
      tags:
        - IAM
      responses:
        "200":
          description: Pending NodeLoc profile and suggested account choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeLocPendingResponse"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pending setup could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/nodeloc/email/code:
    post:
      operationId: postNodeLocEmailCode
      summary: Send the email verification code for NodeLoc account ownership
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinuxDOEmailCodeRequest"
      responses:
        "204":
          description: Verification code sent
          headers:
            Retry-After:
              schema:
                type: integer
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid email, account choice, or human verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification code request throttled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/nodeloc/complete:
    post:
      operationId: postNodeLocComplete
      summary: Verify email ownership and finish NodeLoc login
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinuxDOCompleteRequest"
      responses:
        "200":
          description: NodeLoc account ownership completed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending setup expired or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: New registration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email or NodeLoc identity is already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Email, account choice, account state, or verification code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/github:
    get:
      operationId: getGitHubAuthorize
      summary: Start GitHub OAuth login
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to GitHub authorization
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login when GitHub OAuth is unavailable
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/github/bind:
    get:
      operationId: getGitHubBind
      summary: Start GitHub binding for the current user
      tags:
        - IAM
      responses:
        "302":
          description: Redirect to GitHub authorization
          headers:
            Location:
              schema:
                type: string
        "303":
          description: Redirect back to login or account when binding cannot start
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/github/callback:
    get:
      operationId: getGitHubCallback
      summary: Complete GitHub OAuth login or binding
      tags:
        - IAM
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to login or account with the OAuth result
          headers:
            Location:
              schema:
                type: string

  /v1/oauth/github/pending:
    get:
      operationId: getGitHubPending
      summary: Get the pending GitHub account verification
      tags:
        - IAM
      responses:
        "200":
          description: Pending GitHub profile and local email to verify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubPendingResponse"
        "401":
          description: Pending verification expired, or the binding session changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pending verification could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/github/email/code:
    post:
      operationId: postGitHubEmailCode
      summary: Send the local account email code for GitHub linking
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubEmailCodeRequest"
      responses:
        "204":
          description: Verification code sent
          headers:
            Retry-After:
              schema:
                type: integer
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending verification expired, or the binding session changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Email or human verification is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Verification code request throttled
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Human verification or mail delivery is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/oauth/github/complete:
    post:
      operationId: postGitHubComplete
      summary: Verify local mailbox ownership and finish GitHub login or binding
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCompleteRequest"
      responses:
        "200":
          description: Existing account linked and login session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "204":
          description: GitHub account bound to the current authenticated account
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pending verification expired, or the binding session changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: GitHub account no longer meets the configured age policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: GitHub identity is already bound to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Account state or verification code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many verification attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Account verification could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/login:
    post:
      operationId: postLogin
      summary: Login and create a session
      tags:
        - IAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, HttpOnly cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
                description: sid HttpOnly cookie and csrf_token SameSite cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Human verification failed, or account or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Login rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Human verification is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/sessions/current:
    delete:
      operationId: deleteSession
      summary: Logout and delete current session
      description: Idempotently deletes the session cookie value when present and always expires the browser authentication cookies. This recovery endpoint intentionally does not require CSRF because a missing CSRF cookie must not prevent logout.
      tags:
        - IAM
      security: []
      responses:
        "204":
          description: Logged out or already logged out
        "500":
          description: Session cleanup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # --- Current User ---
  /v1/me:
    get:
      operationId: getMe
      summary: Get current authenticated user profile
      tags:
        - IAM
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/UserResponse"
                additionalProperties: false
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user-groups:
    get:
      operationId: getUserGroups
      summary: List enabled membership groups
      tags:
        - IAM
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Enabled membership group list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserGroupListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me/invite:
    get:
      operationId: getMeInvite
      summary: Get current user's referral invite code
      tags:
        - IAM
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current referral invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInviteResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Referral invite not created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: postMeInvite
      summary: Create or get current user's referral invite code
      tags:
        - IAM
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Current referral invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentInviteResponse"
