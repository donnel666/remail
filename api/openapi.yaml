  # --- Admin: Users ---
  /v1/admin/users:
    get:
      operationId: getAdminUsers
      summary: List all users (admin only)
      description: Requires `iam:user/read`. The Microsoft resource owner picker uses the existing paginated IAM query and must not infer owner eligibility client-side; mutation commands revalidate that the selected user exists and is enabled.
      tags:
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ids
          in: query
          description: Optional comma-separated or repeated user IDs for exact batch lookup.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              minimum: 1
        - name: search
          in: query
          description: Unified fuzzy search across user email, nickname, and ID.
          schema:
            type: string
            maxLength: 120
        - name: role
          in: query
          schema:
            type: string
            enum: [user, supplier, admin, super_admin]
            x-enum-varnames:
              - GetAdminUsersParamsRoleUser
              - GetAdminUsersParamsRoleSupplier
              - GetAdminUsersParamsRoleAdmin
              - GetAdminUsersParamsRoleSuperAdmin
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: userGroupId
          in: query
          schema:
            type: integer
