      summary: Start Apple account onboarding for iCloud resources
      description: |
        Requires `core:resource/operate` and `governance:task/read`, so every operator who starts onboarding can recover its durable task after closing the dialog. Accepts up to 1,000 UTF-8 account lines with 9 or 10 fields in `region----iCloud opened----Apple ID----password----security answer 1----security answer 2----security answer 3----birthday----phone[----family invitation URL]` format. A 9-field entry is stored as a primary account and skips family onboarding; a 10-field entry is stored as a child account and joins the supplied invitation before pausing for manual family-sharing confirmation. The supplied phone becomes the permanent binding. Apple passwords, security answers, browser session payloads, Cookie values, submitted verification codes, and uploaded source text remain write-only.
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
      requestBody:
        required: true
