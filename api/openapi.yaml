  # --- Dashboard ---
  /v1/dashboard:
    get:
      operationId: getDashboard
      summary: Current user's console data dashboard
      description: |
        Aggregated analytics for the signed-in user's console overview — code
        receipt and purchase-activation quality, spend, project series and rankings,
        and today/all-time cross-user successful-order
        leaderboards (delivered code orders plus activated purchase orders) — over
        the selected date range. Available to any authenticated user; scoped to
        the caller. Buckets are hourly when the range is a single day, else daily.
      tags:
        - Dashboard
      security:
        - cookieAuth: []
      parameters:
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Console dashboard aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/admin/monitoring:
    get:
      operationId: getAdminSystemMonitoring
      summary: Read the current system monitoring snapshot
      description: Requires `governance:log/read`. Returns host, Go runtime, MySQL pool, Redis, Asynq queue, and bounded application metric data without credentials or configuration secrets.
      tags:
        - Admin
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current monitoring snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMonitoringSnapshot"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Platform data dashboard (admin only)
      description: |
        Platform-wide analytics for the administrator overview — finance
        (recharge/spend/refund/withdraw/platform revenue, reusing the finance
        summary), orders, user growth, Microsoft vs domain code-receipt metrics,
        mailbox inventory, and project code-receipt / inventory-alert rankings —
        over the selected date range. Requires `billing:wallet/read`. Buckets are
        hourly when the range is a single day, else daily. Inventory totals are a
        point-in-time snapshot flat-lined across the trend (no historical
        snapshot store).
      tags:
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Platform dashboard aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

