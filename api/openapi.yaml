    ResourceBulkSelection:
      type: object
      required:
        - mode
      oneOf:
        - required:
            - mode
            - resourceIds
          properties:
            mode:
              type: string
              enum: [ids]
            resourceIds:
              type: array
              minItems: 1
              maxItems: 10000
              items:
                type: integer
                minimum: 1
        - required:
            - mode
            - filter
          properties:
            mode:
              type: string
              enum: [filter]
            filter:
              $ref: "#/components/schemas/ResourceBulkFilter"
      properties:
        mode:
          type: string
          enum: [ids, filter]
          description: ids selects explicit checked resources; filter selects all private resources matching the server-side filters.
        resourceIds:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: integer
            minimum: 1
          description: Required when mode is ids.
        filter:
          $ref: "#/components/schemas/ResourceBulkFilter"
      additionalProperties: false

    ResourceBulkFilter:
      type: object
      required:
        - resourceType
      properties:
        resourceType:
          type: string
          enum: [microsoft, domain]
        search:
          type: string
          description: Unified fuzzy search. Microsoft matches email and suffix; domain matches domain and TLD.
        suffix:
          type: string
          description: Exact Microsoft suffix such as @outlook.com.
        tld:
          type: string
          description: Exact domain suffix such as .com.
        status:
          type: string
        purpose:
          type: string
          enum: [not_sale, sale, binding]
          description: Domain resource purpose filter. not_sale means private/unavailable for sale; sale means public supply; binding is displayed as auxiliary mailbox in Chinese.
        forSale:
          type: boolean
          description: Microsoft public supply filter. false is private; true is public sale.
        longLived:
          type: boolean
          description: Microsoft long-lived filter.
        graphAvailable:
          type: boolean
          description: Microsoft Graph availability filter.
        createdFrom:
          type: string
          format: date-time
          description: Inclusive resource creation lower bound. The frontend must send ISO date-time.
        createdTo:
          type: string
          format: date-time
          description: Inclusive resource creation upper bound. The frontend must send ISO date-time.
      additionalProperties: false

