        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/admin/lotteries/{lotteryId}:
    get:
      operationId: getAdminLottery
      summary: Read a lottery campaign
      tags: [Lottery]
      security:
        - cookieAuth: []
      parameters:
        - name: lotteryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lottery campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/lotteries/{lotteryId}/entries:
    get:
      operationId: getAdminLotteryEntries
      summary: List lottery entries
      tags: [Lottery]
      security:
        - cookieAuth: []
      parameters:
        - name: lotteryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Lottery entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryEntryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/lotteries/{lotteryId}/payouts:
    get:
      operationId: getAdminLotteryPayouts
      summary: List lottery payouts
      tags: [Lottery]
      security:
        - cookieAuth: []
      parameters:
        - name: lotteryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Lottery payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryPayoutListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    TicketNoPath:
      name: ticketNo
      in: path
      required: true
      schema:
        type: string
    TicketTypeQuery:
      name: ticketType
      in: query
      schema:
        type: string
        enum: [order, general]
    TicketStatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [open, processing, closed]
    TicketSearchQuery:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    CreatedFromQuery:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
    CreatedToQuery:
      name: createdTo
      in: query
      schema:
        type: string
        format: date-time
    OffsetQuery:
      name: offset
      in: query
      description: Row offset used when afterId is absent.
      schema:
        type: integer
        default: 0
    AfterIdQuery:
      name: afterId
      in: query
      description: Last ticket id from the previous page.
      schema:
        type: integer
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    BotChannel:
      name: X-Bot-Channel
      in: header
      required: true
      description: Channel resolved from the trusted AstrBot event. After authenticating the System Key, ReMail requires this value to match the key's immutable platform type; a QQ key cannot authorize Telegram traffic and vice versa. It is never accepted from an end-user or LLM argument.
      schema:
        type: string
        enum: [qq, telegram]
        x-enum-varnames: [Qq, Telegram]
    BotSubject:
      name: X-Bot-Subject
      in: header
      required: true
      description: Positive decimal QQ or Telegram user ID supplied only by the authenticated bot adapter. It is stored as the channel-scoped third-party identity and is never accepted from a request body or LLM argument.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[1-9][0-9]*$"
    BotScene:
      name: X-Bot-Scene
      in: header
      required: true
      description: Private scenes may use the current bound account and must omit X-Bot-Group. Group scenes require an allowed X-Bot-Group; binding remains private-only, while diagnosis is available for the current sender's own bound account.
      schema:
        type: string
        enum: [private, group]
    BotGroup:
      name: X-Bot-Group
      in: header
      required: false
      description: Trusted platform group id supplied by the bot adapter. QQ values are positive decimal group numbers and Telegram values are non-zero decimal Chat IDs (normally negative). Required only when X-Bot-Scene is group, where it must match the authenticated Bot System Key's allowedGroupIds; omit it for private scenes. It is never accepted from an end-user argument.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^-?[1-9][0-9]*$"
    BotPrivateScene:
      name: X-Bot-Scene
      in: header
      required: true
      description: Credential and account-specific operations are private-chat only; X-Bot-Group must be omitted.
      schema:
        type: string
        enum: [private]
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: CSRF token from the csrf_token SameSite cookie; required for authenticated state-changing requests.

    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: CSRF token from the csrf_token SameSite cookie; required for Session state-changing requests and ignored for API Key requests.

    TurnstileToken:
      name: X-Turnstile-Token
      in: header
      required: false
      schema:
        type: string
      description: >-
        Single-use Cloudflare Turnstile token. Required when captcha_enabled is
        on for low-frequency,
        high-damage writes (money movement, submissions entering a human review
        queue, bulk supplier imports). Each route expects a token minted for its
        own action string, so a token cannot be replayed across routes. Ignored
        when the captcha_enabled system setting is off. Not required on the
        API-key /v1/open surface.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Required for money-write APIs. Reusing the same key with a different request fingerprint returns 409.

    AdminCommandIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Required for administrator commands that create durable facts. Reusing the key with a different normalized request returns 409.
    AdminStateCommandIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Required retry identity for target-state administrator commands. Repeating an already-applied target state is a no-op.
    AdminDomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExpectedAdminResourceVersion:
      name: version
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      description: Exact integer resource version from the latest administrator resource result. A stale value returns 409 without a partial write.

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly session cookie set after login

    bearerAuth:
      type: http
      scheme: bearer
      description: User API key in the Authorization header, for example `Bearer rk-...`; SDK clients may also use `X-API-Key`.

    systemKeyAuth:
      type: apiKey
      in: header
      name: X-System-Key
      description: Server-side integration key created in administrator system settings. Its immutable purpose and scope restrict it to iCloud forwarding, SMTP submission, or one Bot platform namespace.

  responses:
    BadRequest:
      description: Malformed JSON, path, query, pagination, enum, or multipart input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested fact does not exist in the authorized scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, uniqueness, idempotency, active-allocation, or optimistic-concurrency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: The request is syntactically valid but violates field or domain constraints
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the request may be retried
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: An authorized upstream content read failed safely
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required internal or upstream dependency is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "ok"
      additionalProperties: false

    ReadyzResponse:
      type: object
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          example: "ok"
        dependencies:
          type: object
          additionalProperties:
            type: string
            example: "healthy"
      additionalProperties: false

    Error:
      type: object
      required:
        - message
        - requestId
      properties:
        code:
          type: string
          description: Stable business error code for client-side translation (optional)
        message:
          type: string
          description: Safe business error message for the user
          example: "Account or password is incorrect."
        requestId:
          type: string
          description: Correlation ID for troubleshooting
          example: "req_a1b2c3d4"
        fields:
          type: object
          description: Field-level validation errors (optional)
          additionalProperties:
            type: string
            example: "Email format is invalid."
      additionalProperties: false

    LotteryTierWeights:
      description: Legacy wire name. New campaigns use fixed prize counts; consolation is derived from the participant count, and normal/lucky are requested counts.
      type: object
      required: [consolation, normal, lucky]
      properties:
        consolation:
          type: integer
          minimum: 0
          maximum: 5000
        normal:
          type: integer
          minimum: 0
          maximum: 5000
        lucky:
          type: integer
          minimum: 0
          maximum: 5000
      additionalProperties: false

    LotteryType:
      type: string
      enum: [fixed, growing]
      description: >-
        Fixed uses one configured pool. Growing starts at totalAmount and adds
        poolIncrementAmount for every accepted participant.

    CreateLotteryRequest:
      type: object
      description: Lottery amounts are whole points. For a fixed lottery, totalAmount is the complete pool. For a growing lottery, totalAmount is the starting pool and poolIncrementAmount is added for every accepted participant. Prize counts are fixed for lucky and normal awards; all remaining participants receive the minimum award. Set at least one draw condition; if both are provided, whichever condition is met first starts the draw.
      required: [title, totalAmount, minPayout, maxPayout, tierWeights, minAccountAgeDays]
      properties:
        title:
          type: string
          maxLength: 120
        lotteryType:
          $ref: "#/components/schemas/LotteryType"
          description: Optional; omitted values default to fixed on the server.
        totalAmount:
          type: string
          pattern: '^[0-9]+(\.0{1,6})?$'
          description: Fixed pool, or starting pool when lotteryType is growing.
        poolIncrementAmount:
          type: string
          pattern: '^[0-9]+(\.0{1,6})?$'
          description: Whole points added to the pool for every accepted participant in a growing lottery; omitted values default to 0 on the server.
        minPayout:
          type: string
          pattern: '^[0-9]+(\.0{1,6})?$'
        maxPayout:
          type: string
          pattern: '^[0-9]+(\.0{1,6})?$'
        tierWeights:
          $ref: "#/components/schemas/LotteryTierWeights"
        minAccountAgeDays:
          type: integer
          minimum: 0
        drawAt:
          type: string
          format: date-time
          nullable: true
          description: Optional future draw time. The activity can use this condition, the participant target, or both.
        participantTarget:
          type: integer
          minimum: 1
          nullable: true
          description: Optional participant count that triggers the draw. The activity can use this condition, the draw time, or both.
      additionalProperties: false

    LotteryResponse:
      type: object
      required: [id, publicToken, publicUrl, title, lotteryType, startingAmount, totalAmount, poolIncrementAmount, minPayout, maxPayout, tierWeights, minAccountAgeDays, participantCount, maxParticipants, algorithmVersion, status, unusedAmount, createdAt]
      properties:
        id:
          type: integer
        publicToken:
          type: string
        publicUrl:
          type: string
        title:
          type: string
        lotteryType:
          $ref: "#/components/schemas/LotteryType"
        startingAmount:
          type: string
          description: Starting pool; equal to totalAmount for fixed lotteries.
        totalAmount:
          type: string
          description: Current pool while open, or the settled pool at draw time.
        poolIncrementAmount:
          type: string
          description: Whole points added for every accepted participant; zero for fixed lotteries.
        minPayout:
          type: string
        maxPayout:
          type: string
        tierWeights:
          $ref: "#/components/schemas/LotteryTierWeights"
        minAccountAgeDays:
          type: integer
        drawAt:
          type: string
          format: date-time
          nullable: true
        participantTarget:
          type: integer
          nullable: true
          description: Participant count trigger, or null when the activity is time-only.
        participantCount:
          type: integer
        maxParticipants:
          type: integer
          description: Internal entry safety cap; it is not a draw condition when participantTarget is null.
        algorithmVersion:
          type: string
          description: Internal allocator version for administrator auditing.
        status:
          type: string
          enum: [funding, open, settling, completed, cancelled]
        triggeredBy:
          type: string
          nullable: true
        unusedAmount:
          type: string
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    PublicLotteryResponse:
      type: object
      required: [lottery, hasEntered]
      properties:
        lottery:
          $ref: "#/components/schemas/PublicLotterySummary"
        hasEntered:
          type: boolean
        myPayout:
          allOf:
            - $ref: "#/components/schemas/PublicPayoutResponse"
          nullable: true
      additionalProperties: false

    PublicLotterySummary:
      type: object
      required: [title, totalAmount, participantCount, status]
      properties:
        title:
          type: string
        totalAmount:
          type: string
        participantCount:
          type: integer
          minimum: 0
          description: Current number of eligible entries in the activity.
        participantTarget:
          type: integer
          minimum: 1
          nullable: true
          description: Optional public participant total configured for the activity. Omitted when no total was configured.
        drawAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [funding, open, settling, completed, cancelled]
      additionalProperties: false

    PublicPayoutResponse:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
      additionalProperties: false

    PublicEntryResponse:
      type: object
      required: [already]
      properties:
        already:
          type: boolean
      additionalProperties: false

    LotteryEntryResponse:
      type: object
      required: [id, lotteryId, userId, registeredAt, already]
      properties:
        id:
          type: integer
        lotteryId:
          type: integer
        userId:
          type: integer
        registeredAt:
          type: string
          format: date-time
        already:
          type: boolean
      additionalProperties: false

    LotteryPayoutResponse:
      type: object
      required: [id, lotteryId, userId, tier, amount]
      properties:
        id:
          type: integer
        lotteryId:
          type: integer
        userId:
          type: integer
        tier:
          type: string
          enum: [consolation, normal, lucky]
        amount:
          type: string
        billingTransactionNo:
          type: string
      additionalProperties: false

    LotteryListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LotteryResponse"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
      additionalProperties: false

    LotteryEntryListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LotteryEntryResponse"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
      additionalProperties: false

    LotteryPayoutListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LotteryPayoutResponse"
        total:
          type: integer
          format: int64
        offset:
          type: integer
        limit:
          type: integer
      additionalProperties: false

    APIKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        expireAt:
          type: string
          format: date-time
          nullable: true
        concurrencyLimit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 500
          description: Empty inherits the user's group limit. Explicit values are still capped by the group limit; a group limit of 0 falls back to the system default of 500.
        quotaLimit:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Empty means unlimited total requests.
      additionalProperties: false

    APIKeyPatchRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        enabled:
          type: boolean
        expireAt:
          type: string
          format: date-time
          nullable: true
        concurrencyLimit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 500
          description: Empty inherits the user's group limit. Explicit values are still capped by the group limit; a group limit of 0 falls back to the system default of 500.
        quotaLimit:
          type: integer
          format: int64
          minimum: 1
          nullable: true
      additionalProperties: false

    APIKeyResponse:
      type: object
      required:
        - id
        - name
        - keyPrefix
        - enabled
        - concurrencyLimit
        - quotaUsed
        - activeRequests
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        keyPrefix:
          type: string
        keyPlain:
          type: string
          description: Plain API key returned to its owner on create, list, and detail views.
        enabled:
          type: boolean
        concurrencyLimit:
          type: integer
          nullable: true
        quotaLimit:
          type: integer
          format: int64
          nullable: true
        quotaUsed:
          type: integer
          format: int64
        remainingQuota:
          type: integer
          format: int64
          nullable: true
        activeRequests:
          type: integer
        expireAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    APIKeyListResponse:
      type: object
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyResponse"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
      additionalProperties: false

    APIKeyUsageResponse:
      type: object
      required:
        - requestCount
        - keyCount
      properties:
        requestCount:
          type: integer
          format: int64
          description: Total accepted API key request count across current non-deleted API keys.
        keyCount:
          type: integer
          format: int64
          description: Current non-deleted API key count.
      additionalProperties: false

    APIKeyRealtimeUsageResponse:
      type: object
      required:
        - activeRequests
        - requestsPerMinute
      properties:
        activeRequests:
          type: integer
          format: int64
          description: API key requests currently executing for this user across all application instances.
        requestsPerMinute:
          type: integer
          format: int64
          description: Accepted API key requests started during the current and previous 59 one-second buckets; this is observed traffic, not a rate limit.
      additionalProperties: false

    CreateOrderRequest:
      type: object
      required:
        - projectId
        - emailSuffix
      properties:
        projectId:
          type: integer
        emailSuffix:
          type: string
          description: Product selector. gmail.com selects Gmail (local dot-alias allocation only; the original primary address is never allocated), gmail_variant selects the local Gmail variant product (plus-alias allocation only; it is not a real domain), icloud.com selects iCloud, a configured Microsoft mailbox domain such as outlook.com selects that exact Microsoft suffix, and a public suffix such as com or com.cn selects that exact domain-email suffix. The special value outlook randomly selects an in-stock configured Microsoft suffix, and domain randomly selects an in-stock domain suffix; both choices are weighted by available inventory. With private_first, random weighting uses owned inventory first and falls back to public inventory only when no owned suffix is in stock; an owned full domain such as mydomain.com selects only that private domain. Full mailbox addresses are not accepted.
      additionalProperties: false

    CreateOrderBatchRequest:
      type: object
      required:
        - projectId
        - emailSuffix
        - quantity
      properties:
        projectId:
          type: integer
        emailSuffix:
          type: string
          description: Product selector. gmail.com selects Gmail (local dot-alias allocation only; the original primary address is never allocated), gmail_variant selects the local Gmail variant product (plus-alias allocation only; it is not a real domain), icloud.com selects iCloud, a configured Microsoft mailbox domain such as outlook.com selects that exact Microsoft suffix, and a public suffix such as com or com.cn selects that exact domain-email suffix. The special value outlook randomly selects an in-stock configured Microsoft suffix, and domain randomly selects an in-stock domain suffix; both choices are weighted by available inventory. With private_first, random weighting uses owned inventory first and falls back to public inventory only when no owned suffix is in stock. A batch resolves the special value once, uses that suffix for every item, and does not select another suffix after that inventory is exhausted. An owned full domain such as mydomain.com selects only that private domain. Full mailbox addresses are not accepted.
        quantity:
          type: integer
          minimum: 2
          maximum: 100
          description: Number of independent orders to create.
      additionalProperties: false

    CreateOrderBatchResponse:
      type: array
      minItems: 2
      maxItems: 100
      items:
        $ref: "#/components/schemas/CreateOrderBatchItemResponse"

    OrderPickupCredentialsRequest:
      type: object
      required:
        - orderNos
      properties:
        orderNos:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
      additionalProperties: false

    OrderPickupCredentialResponse:
      type: object
      required:
        - orderNo
        - deliveryEmail
        - serviceToken
      properties:
        orderNo:
          type: string
        deliveryEmail:
          type: string
        serviceToken:
          type: string
          description: Service credential used to construct the order pickup URL.
      additionalProperties: false

    OrderPickupCredentialsResponse:
      type: array
      maxItems: 100
      items:
        $ref: "#/components/schemas/OrderPickupCredentialResponse"

    OrderBatchItemErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [insufficient_balance, insufficient_inventory, idempotency_conflict, temporarily_unavailable]
        message:
          type: string
      additionalProperties: false

    CreateOrderBatchItemResponse:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [succeeded, failed]
        order:
          $ref: "#/components/schemas/OrderResponse"
        error:
          $ref: "#/components/schemas/OrderBatchItemErrorResponse"
      additionalProperties: false

    AdminOrderCommandRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false

    ExpireOrdersResponse:
      type: object
      required:
        - codeTimedOut
        - purchaseActivationCompleted
        - purchaseWarrantyCompleted
        - codeCleaned
        - cleanupRetried
        - deliveryReconciled
        - failed
      properties:
        codeTimedOut:
          type: integer
        purchaseActivationCompleted:
          type: integer
        purchaseWarrantyCompleted:
          type: integer
        codeCleaned:
          type: integer
        cleanupRetried:
          type: integer
        deliveryReconciled:
          type: integer
        failed:
          type: integer
      additionalProperties: false

    LedgerAmount:
      type: string
      description: Signed point amount with up to 6 decimal places; canonical responses retain at least 2 decimal places and the absolute value must fit DECIMAL(18,6).
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'

    NonNegativeLedgerAmount:
      type: string
      description: Non-negative point amount with up to 6 decimal places; canonical responses retain at least 2 decimal places and the value must fit DECIMAL(18,6).
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'

    PositiveIntegerPointAmount:
      type: string
      description: Positive whole-number point amount; a decimal representation is accepted only when its fractional part is zero, and the value must fit DECIMAL(18,6).
      pattern: '^[0-9]*[1-9][0-9]*(\.0{1,6})?$'

    LedgerAmountResponse:
      type: string
      description: Signed point amount with up to 6 decimal places.
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'

    NonNegativeLedgerAmountResponse:
      type: string
      description: Non-negative point amount with up to 6 decimal places.
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'

