  /v1/admin/icloud/resources/imports:
    post:
      operationId: postAdminICloudResourceImport
      summary: Import iCloud resources for a selected owner
      description: |
        Consumes one verified import preparation and one complete credential entry containing one old cURL, one new cURL, or both cURLs in either order: `email----curl[----curl]`. Browser-copied cURL commands may use backslash line continuations. The server classifies each cURL by its Apple host and path, parses it without executing shell syntax, and rejects multiple resource entries. The prepared forwarding address is persisted on the iCloud resource and validation requires an exact Apple forwarding-address match. The required `expireAt` controls only future alias creation; it does not stop allocation or receiving. Cookies, cURL source, and parsed provider context remain write-only.
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/AdminCommandIdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ownerId, preparationId, errorStrategy, expireAt]
              properties:
                file:
                  type: string
                  format: binary
                ownerId:
                  type: integer
                  minimum: 1
                preparationId:
                  type: integer
                  minimum: 1
                errorStrategy:
                  type: string
                  enum: [skip, abort]
                expireAt:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        "202":
          description: Durable import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminICloudImportResponse"
